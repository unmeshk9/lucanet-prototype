    // 3. GATE POLICY THRESHOLDS

      strict:   { t2Min: 96.5, maxAudit: 7.5, maxOverride: 3.0, maxFallback: 1.8 }
    };

    function evaluateDomain(data, policy) {
      const t1Ok = data.t1Pass === data.t1Total;
      const t2Ok = data.t2Score >= policy.t2Min;
      const t3Ok =
        data.t3.auditTime <= policy.maxAudit &&
        data.t3.overrideRate <= policy.maxOverride &&
        data.t3.fallbackRate <= policy.maxFallback;

      if (!t1Ok) return { status: 'BLOCKED', label: 'Blocked', dot: 'bg-rose-600', text: 'text-rose-700', bg: 'bg-rose-50', border: 'border-rose-200' };
      if (!t2Ok || !t3Ok) return { status: 'WARN', label: 'Hold / Canary', dot: 'bg-amber-500', text: 'text-amber-800', bg: 'bg-amber-50', border: 'border-amber-200' };
      return { status: 'PASS', label: 'Ready', dot: 'bg-emerald-600', text: 'text-emerald-800', bg: 'bg-emerald-50', border: 'border-emerald-200' };
    }

              <div className="text-[11px] font-mono text-neutral-400 shrink-0">
                Zero Proprietary Data
              </div>
            </section>

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
