    // ---------------------------------------------------------------------------
    // 3. GATE EVALUATOR
    // ---------------------------------------------------------------------------
    function evaluateDomain(domData, isStrict) {
      const t2Gate = isStrict ? 96.5 : 94.0;
      const t1PassedCount = domData.t1.filter(i => i.pass).length;
      const t1AllPass = t1PassedCount === domData.t1.length;

      const t2Avg = +(domData.t2.reduce((acc, item) => acc + item.score, 0) / domData.t2.length).toFixed(1);
      const t2Pass = t2Avg >= t2Gate;

      const t3Pass = domData.t3.every(sig => {
        const cap = isStrict ? sig.maxStrict : sig.maxStd;
        return sig.val <= cap;
      });

      let status = 'PASS';
      let label = 'READY';
      if (!t1AllPass) {
        status = 'BLOCKED';
        label = 'BLOCKED';
      } else if (!t2Pass || !t3Pass) {
        status = 'WARN';
        label = 'CANARY';
      }

      return { status, label, t1PassedCount, t1AllPass, t2Avg, t2Gate, t2Pass, t3Pass };
    }

        // 1-5 switches Lucanet product domains
        if (['1', '2', '3', '4', '5'].includes(e.key)) {
          const idx = parseInt(e.key, 10) - 1;
          if (PRODUCT_DOMAINS[idx]) setDomainId(PRODUCT_DOMAINS[idx].id);
        }
        // Up/Down or J/K cycles Shared Core Changes
        else if (e.key === 'ArrowDown' || e.key.toLowerCase() === 'j') {
          e.preventDefault();
          const currIdx = SCENARIOS.findIndex(s => s.id === scenarioId);
          const nextIdx = (currIdx + 1) % SCENARIOS.length;
          setScenarioId(SCENARIOS[nextIdx].id);
        } else if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'k') {
          e.preventDefault();
          const currIdx = SCENARIOS.findIndex(s => s.id === scenarioId);
          const prevIdx = (currIdx - 1 + SCENARIOS.length) % SCENARIOS.length;
          setScenarioId(SCENARIOS[prevIdx].id);

        // P toggles Gate Policy
        else if (e.key.toLowerCase() === 'p') {
          setIsStrict(prev => !prev);
        }
        // T toggles Dark/Light theme
        else if (e.key.toLowerCase() === 't') {
          setIsDark(prev => !prev);
        }
      }, [scenarioId]);

      useEffect(() => {
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
